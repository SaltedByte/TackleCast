name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate for a release
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.93.1
          components: rustfmt
      - run: cargo fmt --all --check
      - run: python3 -m py_compile scripts/verify_package.py scripts/smoke_test.py
      - run: git diff --check

  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.features }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        features: [default, software]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.93.1
          components: clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: ${{ matrix.features }}
          env-vars: FFMPEG_DIR PKG_CONFIG_PATH
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .deps
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/setup_*_dependencies.*', 'scripts/windows-dependencies.json') }}
      - name: Linux compiler and audio headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential nasm libasound2-dev libclang-dev pkg-config
      - name: Linux FFmpeg
        if: runner.os == 'Linux'
        run: bash scripts/setup_linux_dependencies.sh
      - name: Windows FFmpeg
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\setup_windows_dependencies.ps1
      - name: Tests
        shell: bash
        env:
          FEATURES: ${{ matrix.features }}
        run: |
          flags=()
          if [[ "$FEATURES" == software ]]; then flags+=(--no-default-features); fi
          cargo test --locked "${flags[@]}"
      - name: Clippy
        shell: bash
        env:
          FEATURES: ${{ matrix.features }}
        run: |
          flags=()
          if [[ "$FEATURES" == software ]]; then flags+=(--no-default-features); fi
          cargo clippy --locked --all-targets "${flags[@]}" -- -D warnings
      - name: Release build
        shell: bash
        env:
          FEATURES: ${{ matrix.features }}
        run: |
          flags=()
          if [[ "$FEATURES" == software ]]; then flags+=(--no-default-features); fi
          cargo build --release --locked "${flags[@]}"
